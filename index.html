<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CraftAIB · 极简视觉编辑器</title>
  <link rel="stylesheet" href="style/style.css" />
  <script src="src/blockPalette.js" type="module"></script>
  <script src="src/script.js" type="module"></script>
  <script src="src/schematic.js" type="module"></script>
  <script src="src/gui.js" type="module"></script>
  <script src="https://git.io/glm-js.min.js"></script>
</head>
<body>
  <main class="studio-shell">
    <header class="topbar">
      <div class="brand-lockup">
        <img src="res/logo.png" alt="CraftAIB" class="brand-mark" />
        <div>
          <div class="brand-name">CraftAIB</div>
          <div class="brand-subtitle">Minimal Voxel Studio</div>
        </div>
      </div>
      <nav class="topnav" aria-label="主导航">
        <button class="nav-item is-active" type="button">编辑</button>
        <button class="nav-item" type="button">预览</button>
        <button class="nav-item" type="button">资源</button>
        <button class="nav-item" type="button">设置</button>
      </nav>
      <div class="topbar-meta">
        <span class="save-state"><span class="status-dot"></span> 本地自动保存</span>
        <span class="clock">12:34</span>
        <a href="https://github.com/addxiaoyi/CraftAIB" target="_blank" rel="noreferrer" class="icon-link" aria-label="打开 GitHub">↗</a>
      </div>
    </header>

    <div class="workspace">
      <aside class="toolrail" aria-label="工具栏">
        <button class="tool-button is-active" type="button" aria-label="选择工具">↖</button>
        <button class="tool-button" type="button" aria-label="裁剪工具">⌗</button>
        <button class="tool-button" type="button" aria-label="体素工具">◇</button>
        <button class="tool-button" type="button" aria-label="材质工具">▦</button>
        <button class="tool-button" type="button" aria-label="设置工具">⚙</button>
        <div class="tool-spacer"></div>
        <label class="asset-thumb is-selected" aria-label="当前项目素材">
          <input id="image-input" type="file" accept="image/*" />
          <img src="res/upload.svg" alt="上传图片" />
        </label>
        <button class="tool-button add-button" type="button" aria-label="上传图片" onclick="document.getElementById('image-input').click()">＋</button>
      </aside>

      <section class="editor-column">
        <div class="canvas-stage">
          <div class="canvas-toolbar">
            <div class="canvas-title">
              <span class="eyebrow">SCENE / 01</span>
              <strong>Skyhold study</strong>
            </div>
            <div class="canvas-actions">
              <button class="quiet-button" type="button" id="reset-image">重置图片</button>
              <button class="quiet-button" type="button" id="reset-3d">重置视角</button>
              <span class="zoom-label">100%</span>
            </div>
          </div>
          <label class="hero-canvas" for="image-input">
            <canvas id="glcanvas" class="processing-preview" width="1" height="1"></canvas>
            <canvas id="canvas" class="voxel-preview" width="1" height="1"></canvas>
            <span class="canvas-hint">拖入图片，或点击此处上传</span>
          </label>
          <div class="canvas-footer">
            <span><span class="live-dot"></span> 实时预览</span>
            <span id="canvas-size">512 × 512 px</span>
          </div>
        </div>

        <section class="timeline-panel" aria-label="参数时间线">
          <div class="timeline-head">
            <div class="transport">
              <button class="transport-button" type="button" aria-label="回到开始">|‹</button>
              <button class="transport-button transport-play" type="button" aria-label="开始体素化" id="convertButton">▶</button>
              <button class="transport-button" type="button" aria-label="下一步">›|</button>
              <span class="timeline-time">00:00 <span>/ 00:30</span></span>
            </div>
            <div class="timeline-actions">
              <button class="quiet-button" type="button" id="downloadSchematicButton" disabled>导出 .SCHEM</button>
              <button class="quiet-button" type="button" id="downloadGridButton" disabled>导出 Grid</button>
              <button class="export-button" type="button" id="downloadButton" disabled>导出 NBT</button>
            </div>
          </div>
          <div class="timeline-ruler"><span>0s</span><span>10s</span><span>20s</span><span>30s</span></div>
          <div class="timeline-track">
            <div class="track-label">图像处理</div>
            <div class="track-lane"><span class="clip clip-violet" style="width:42%">预处理</span><span class="keyframe" style="left:42%"></span></div>
          </div>
          <div class="timeline-track">
            <div class="track-label">体素化</div>
            <div class="track-lane"><span class="clip clip-cyan" style="width:68%">Voxel pass</span><span class="keyframe" style="left:68%"></span></div>
          </div>
          <div class="timeline-track">
            <div class="track-label">调色板</div>
            <div class="track-lane"><span class="clip clip-green" style="width:53%">材质映射</span><span class="keyframe" style="left:53%"></span></div>
          </div>
          <div class="playhead" aria-hidden="true"></div>
        </section>
      </section>

      <aside class="inspector" aria-label="检查器">
        <div class="inspector-header">
          <div>
            <span class="eyebrow">INSPECTOR</span>
            <h1>体素预览</h1>
          </div>
          <span class="inspector-status">READY</span>
        </div>
        <div class="voxel-card">
          <div class="voxel-cube" aria-hidden="true"><span></span><i></i><b></b></div>
          <div class="voxel-details"><span class="eyebrow">OUTPUT</span><strong>3D STRUCTURE</strong><span>等待体素化结果</span></div>
        </div>
        <div class="inspector-section palette-section">
          <div class="section-title"><h2>材质</h2><span class="material-total-count">0 blocks</span></div>
          <div class="blockList-container"><div class="blockList"></div></div>
        </div>
        <div class="inspector-section settings-section" id="settings-image">
          <div class="section-title"><h2>图像参数</h2><button class="reset-mini" type="button" id="reset-image-mini">↻</button></div>
          <div class="compact-controls">
            <label><span>亮度</span><input id="brightness-slider" type="range" min="-100" max="100" value="0"><input id="brightness-number" class="number-input" type="number" min="-100" max="100" value="0"></label>
            <label><span>对比度</span><input id="contrast-slider" type="range" min="-100" max="100" value="0"><input id="contrast-number" class="number-input" type="number" min="-100" max="100" value="0"></label>
            <label><span>饱和度</span><input id="saturation-slider" type="range" min="-100" max="100" value="0"><input id="saturation-number" class="number-input" type="number" min="-100" max="100" value="0"></label>
            <label><span>色温</span><input id="temperature-slider" type="range" min="-100" max="100" value="0"><input id="temperature-number" class="number-input" type="number" min="-100" max="100" value="0"></label>
          </div>
          <div class="advanced-settings">
            <input id="discretize-checkbox" type="checkbox" checked><label for="discretize-checkbox">离散化预览</label>
            <input id="resolution-slider" class="logarithmic" type="range" min="7" max="11" value="9" step="0.5"><input id="resolution-number" class="number-input" type="number" min="128" max="2048" value="512">
          </div>
        </div>
        <div class="inspector-section settings-section" id="settings-3d">
          <div class="section-title"><h2>体素参数</h2><button class="reset-mini" type="button" id="reset-3d-mini">↻</button></div>
          <div class="toggle-row"><label for="pixelart-checkbox">2D Pixel Art</label><input id="pixelart-checkbox" type="checkbox"></div>
          <div class="toggle-row"><label for="enforce-boundary-checkbox">边界约束</label><input id="enforce-boundary-checkbox" type="checkbox"></div>
          <div class="toggle-row"><label for="dither-checkbox">抖动算法</label><input id="dither-checkbox" type="checkbox" checked></div>
          <div class="hidden-compatible-controls">
            <input id="fov-slider" type="range" min="10" max="120" value="60"><input id="fov-number" class="number-input" type="number" value="60">
            <input id="yaw-slider" type="range" min="-180" max="180" value="-45"><input id="yaw-number" class="number-input" type="number" value="-45">
            <input id="pitch-slider" type="range" min="-90" max="90" value="-35"><input id="pitch-number" class="number-input" type="number" value="-35">
            <input id="depth-min" type="range" min="5" max="500" value="10"><input id="depth-min-number" class="number-input" type="number" value="10">
            <input id="depth-max" type="range" min="5" max="500" value="100"><input id="depth-max-number" class="number-input" type="number" value="100">
            <input id="detail" type="range" min="1" max="100" value="50"><input id="detail-number" class="number-input" type="number" value="50">
          </div>
        </div>
      </aside>
    </div>
  </main>
</body>
</html>
